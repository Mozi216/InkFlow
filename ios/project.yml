name: InkFlow
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "26.0"
packages:
  InkFlowCore:
    path: InkFlowCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "7"
    INKFLOW_BUNDLE_ID: com.inkflow.mobile
    CODE_SIGN_STYLE: Automatic
targets:
  InkFlow:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: InkFlowCore
      - target: InkFlowLiveActivity
        embed: true
      - target: InkFlowBroadcast
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(INKFLOW_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_UUID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  InkFlowLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
    dependencies:
      - package: InkFlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(INKFLOW_BUNDLE_ID).lyrics
        INFOPLIST_FILE: LiveActivity/Info.plist
        PROVISIONING_PROFILE_SPECIFIER: $(WIDGET_PROFILE_UUID)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  InkFlowBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Shared/LyricActivity.swift
      - path: Shared/LiveActivityPublisher.swift
      - path: App/Sync/AudioRecognition.swift
      - path: App/Sync/NetEaseClient.swift
    dependencies:
      - package: InkFlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(INKFLOW_BUNDLE_ID).broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        PROVISIONING_PROFILE_SPECIFIER: $(BROADCAST_PROFILE_UUID)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  InkFlow:
    build:
      targets:
        InkFlow: all
    run:
      config: Debug
    archive:
      config: Release
